spring:
  application:
    name: auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:email}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: ${SERVER_PORT:8081}

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: top.contins.authservice.model.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      dialect: postgresql

app:
  name: ${APP_NAME:auth}
  official-website: ${APP_WEBSITE:http://localhost}
  organization-name: ${APP_ORG_NAME:contins}
  contact:
    email: ${APP_EMAIL:support@example.com}
    phone: ${APP_PHONE:}
  working-hours: 9:00-18:00
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  expire:
    access-token: 3600000 # 1小时
    refresh-token: 604800000 # 7天
  issuer: ${spring.application.name}
  key:
    size: 2048
    rotation:
      enabled: true
      interval-hours: 24

redis:
  expire-config:
    - name: email-token
      key: email-token:*
      expire: 86400000 # 24小时
    - name: jwt
      key: jwt:*
      expire: 86400000 # 24小时

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-shenzhen.aliyuncs.com}
    accessKeyId: ${ALIYUN_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIYUN_ACCESS_KEY_SECRET:}
    bucketName: ${ALIYUN_BUCKET_NAME:}
    roleArn: ${ALIYUN_ROLE_ARN:}
  cdnPoint: ${ALIYUN_CDN_POINT:}
