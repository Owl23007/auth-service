spring:
  application:
    name: auth
  profiles:
    active: dev,email,key-dev

server:
  port: 8081

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: top.contins.authservice.model.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

app:
  name: ${app.webname}
  official-website: ${private.app.website}
  organization-name: ${app.organization_name}
  contact:
    email: ${app.email}
    phone: ${app.phone}
  working-hours: 9:00-18:00
  # JWT配置
  jwt:
    expiration: 86400000 # 24小时
    refresh-expiration: 604800000 # 7天
    issuer: ${private.app.website} # 签发者
