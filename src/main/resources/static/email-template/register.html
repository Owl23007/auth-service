<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户激活</title>
</head>
<body>
<div style='font-family: Arial, sans-serif; line-height: 1.6; max-width: 600px; margin: 0 auto;'>
    <h3 style='color: #2B6CB0; border-bottom: 2px solid #2B6CB0; padding-bottom: 8px;'>欢迎注册</h3>
    
    <p>尊敬的 ${username}：</p>
    <p>感谢您注册我们的服务！为了完成您的注册流程，请点击下方按钮激活您的账户：</p>
    
    <a href='${activationUrl}' 
       style='display: inline-block; padding: 12px 24px; background-color: #2B6CB0; color: white; text-decoration: none; border-radius: 4px; margin: 16px 0;'>
       立即激活账户
    </a>
    
    <div style='background: #F7FAFC; padding: 16px; border-left: 4px solid #2B6CB0; margin: 20px 0;'>
        <h4 style='margin-top: 0; color: #2C5282;'>安全提示：</h4>
        <ul style='margin: 0; padding-left: 20px; color: #4A5568;'>
            <li>链接有效期至：${expirationTime}</li>
            <li>请确认浏览器地址栏显示正确的域名</li>
            <li>不要将链接分享给任何人</li>
        </ul>
    </div>
    
    <div style='margin-top: 24px; padding: 16px; background: #EBF8FF; border-radius: 4px;'>
        <p style='margin: 0;'>需要帮助？请联系我们：</p>
        <ul style='margin: 8px 0 0 20px; padding-left: 0; list-style: none;'>
            <li>✉ 服务邮箱：${app.contact.email}</li>
            <li>🕒 工作时间：${app.working-hours}</li>
        </ul>
    </div>
    
    <footer style='margin-top: 24px; color: #718096; font-size: 0.9em; text-align: center;'>
        <p>${organization-name}团队</p>
        <p style='color: #A0AEC0; font-size: 0.8em;'>发送时间：${sendTime}</p>
    </footer>
</div>
</body>
</html>
