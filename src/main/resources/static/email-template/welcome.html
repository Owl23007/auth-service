<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 欢迎使用我们的服务</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #111;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .emoji {
            font-size: 3.5rem;
            margin-bottom: 24px;
            line-height: 1;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .btn {
            display: inline-block;
            background: #00bfa5; /* 薄荷绿 —— 现代、清新、友好 */
            color: white;
            font-weight: 600;
            padding: 14px 36px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 191, 165, 0.3);
        }

        .btn:hover {
            background: #00a18f;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 191, 165, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 25px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .emoji {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="emoji">🎉</div>
    <h1>账户激活成功！</h1>
    <p>欢迎加入我们，现在你可以尽情享受所有功能与服务。如有任何问题，随时联系客服团队～</p>
    <a href="${website}" class="btn">开始使用</a>
</div>
</body>
</html>
